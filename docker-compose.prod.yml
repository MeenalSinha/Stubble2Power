version: '3.8'

# ==============================================================================
# STUBBLE2POWER PRODUCTION DOCKER COMPOSE SPECIFICATION
# Enforces enterprise security posture:
# - Zero host exposure for PostgreSQL / PostGIS database (5432 is internal only)
# - Fail-closed secret injection via environment
# - Container healthchecks, restart policies, and network isolation
# ==============================================================================

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: stubble2power-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB environment variable is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER environment variable is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
    # Security Rule: Database port 5432 is strictly internal to s2p-prod-network; NEVER exposed to host
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - s2p-prod-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 1024M

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stubble2power-prod-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY environment variable is required in production}
      NASA_FIRMS_MAP_KEY: ${NASA_FIRMS_MAP_KEY:-}
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - s2p-prod-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stubble2power-prod-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY environment variable is required in production}
      NASA_FIRMS_MAP_KEY: ${NASA_FIRMS_MAP_KEY:-}
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - s2p-prod-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

networks:
  s2p-prod-network:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
