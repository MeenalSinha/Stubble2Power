version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: stubble2power-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stubble2power}
      POSTGRES_USER: ${POSTGRES_USER:-stubble_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stubble_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stubble_user} -d ${POSTGRES_DB:-stubble2power}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - s2p-network

  backend:
    build: .
    container_name: stubble2power-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-stubble_user}:${POSTGRES_PASSWORD:-stubble_secure_password}@db:5432/${POSTGRES_DB:-stubble2power}}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-stubble2power-secure-production-jwt-secret-key-2026-v230}
      NASA_FIRMS_MAP_KEY: ${NASA_FIRMS_MAP_KEY:-}
    ports:
      - "8000:8000"
    networks:
      - s2p-network

  frontend:
    build: .
    container_name: stubble2power-frontend
    restart: always
    depends_on:
      - backend
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-stubble_user}:${POSTGRES_PASSWORD:-stubble_secure_password}@db:5432/${POSTGRES_DB:-stubble2power}}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-stubble2power-secure-production-jwt-secret-key-2026-v230}
      NASA_FIRMS_MAP_KEY: ${NASA_FIRMS_MAP_KEY:-}
    ports:
      - "8501:8501"
    networks:
      - s2p-network

networks:
  s2p-network:
    driver: bridge

volumes:
  postgres_data:
